<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Mis Gastos</title>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevMonth" aria-label="Mes anterior">‹</button>
    <button class="month-label" id="monthLabel" title="Ir al mes actual"></button>
    <button class="icon-btn" id="nextMonth" aria-label="Mes siguiente">›</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="resumen" class="active"><span>📊</span>Resumen</button>
    <button data-tab="movimientos"><span>📋</span>Movimientos</button>
    <button id="addBtn" class="fab" aria-label="Añadir gasto">+</button>
    <button data-tab="categorias"><span>🏷️</span>Categorías</button>
    <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
